<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#C71E1D">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercado laboral por departamento · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <link rel="stylesheet" href="laboral.css" />
  <style>
    /* el alto del lienzo sale del mapa y del ranking (lo fija el script); esto es sólo el de arranque */
    #chart { height: 420px; }
    @media (max-width: 640px) { #chart { height: 720px; } }
    .ind { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; margin-top: 6px; }
    .ind-n { font-size: .68rem; line-height: 1.6; color: var(--text); }
    .ind-v { font: 600 .68rem/1.6 'JetBrains Mono', monospace; text-align: right; white-space: nowrap; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <script src="laboral.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>El mercado laboral por departamento</div>
      <div class="sec-sub" id="sub">Cada departamento frente a Bolivia, con cuatro trimestres juntos para que la cifra sea precisa</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Indicador</span><div class="hz-grp" id="b-medida"></div></div>
      <div class="hz-item"><span class="hz-lbl">Periodo</span><div class="hz-grp" id="b-periodo"></div></div>
      <div class="hz-item"><span class="hz-lbl">Ámbito</span><div class="hz-grp" id="b-ambito"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando el mapa del empleo…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C, NB = ' ', NAC = 'Bolivia';
    // Escala DIVERGENTE con la bisagra en Bolivia (la del mapa de inflación). Cálido = peor que el país; turquesa =
    // mejor. Para los indicadores donde «más» es mejor (ingreso, seguro de salud, participación) la rampa se invierte.
    var RAMPA = ['#005F73', '#0A9396', '#94D2BD', '#E9D8A6', '#EDA13E', '#DF5D25', '#C71E1D'];
    var REDONDOS = [0.05, 0.1, 0.2, 0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000];
    var TX_CLASE = { '#EDA13E': '#A86E00' };
    var MED = {
      td: { nombre: 'Desocupación', larga: 'tasa de desocupación', mejorBaja: true, fmt: 'pct', desc: 'Busca trabajo y no lo consigue (% de la fuerza de trabajo)' },
      lu4: { nombre: 'Subutilización', larga: 'subutilización amplia (LU4)', mejorBaja: true, fmt: 'pct', desc: 'Desocupados + subocupados por horas + fuerza potencial (%)' },
      toi: { nombre: 'Informalidad', larga: 'ocupación informal', mejorBaja: true, fmt: 'pct', desc: 'Ocupados con empleo informal (%)' },
      ylab_med: { nombre: 'Ingreso', larga: 'ingreso laboral mediano', mejorBaja: false, fmt: 'bs', desc: 'Mediana del ingreso mensual de la ocupación principal (Bs del 1T-2026)' },
      asal_seguro_salud: { nombre: 'Seguro de salud', larga: 'asalariados con seguro de salud', mejorBaja: false, fmt: 'pct', desc: 'Asalariados con seguro de salud por su trabajo (%)' },
      bajo_smn: { nombre: 'Bajo el mínimo', larga: 'ocupados con ingreso menor al salario mínimo', mejorBaja: true, fmt: 'pct', desc: 'Ocupados que ganan menos que el salario mínimo (%)' },
      tgp: { nombre: 'Participación', larga: 'tasa global de participación', mejorBaja: false, fmt: 'pct', desc: 'Trabaja o busca trabajo (% de la población de 14 años o más)' }
    };
    // Indicadores que no se comparan en un departamento (ver la pregunta «Beni»)
    var NO_COMP = { lu4: ['Beni'] };
    var estado = { medida: 'td', per: null, ambito: 'total', k: null };
    var D, P, DEPS = [], CIU_DE = {}, ITEMS = [], ASP = 0.9, ESC = 1, grafico, hover = null;

    var sinTilde = function (s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
    var med = function () { return MED[estado.medida]; };
    var fmt = function (v, m) { if (v == null) return '—'; return (m || med()).fmt === 'bs' ? L.bs(v) : PM.pct(v, 1); };
    var dif = function (d, m) { return (m || med()).fmt === 'bs' ? (d >= 0 ? '+' : '−') + 'Bs' + NB + PM.num(Math.abs(d), 0) : PM.pp(d, 1); };
    var etqPer = function (j) { var p = P[j]; return p === 'AM' ? 'últimos 4 trimestres (' + PM.fecha(D.ventana_am[0]) + ' a ' + PM.fecha(D.ventana_am[1]) + ')' : 'año ' + p + (esEst(j) ? ' (estimación POPULI)' : ''); };
    var etqCorta = function (j) { var p = P[j]; return p === 'AM' ? PM.fecha(D.ventana_am[0]) + '–' + PM.fecha(D.ventana_am[1]) : p + (esEst(j) ? ' · estimado' : ''); };
    // 2020 del total: sin encuesta rural de abril a diciembre. Va la ESTIMACIÓN POPULI (1T observado + 2T-4T estimados),
    // aparte de la serie oficial y marcada en cada cifra (metodologia.html#hueco-2020)
    var esEst = function (j) { j = j == null ? estado.per : j; return estado.ambito === 'total' && !!D.estimados && P[j] === D.estimados.periodo; };

    PM.cargar(['departamentos.json', 'bolivia.geojson']).then(function (r) {
      D = r[0]; P = D.periodos; estado.per = P.length - 1;
      DEPS = Object.keys(D.datos.total).filter(function (c) { return c !== NAC; });
      var porNom = {}; DEPS.forEach(function (c) { porNom[sinTilde(c)] = c; });
      r[1].features.forEach(function (ft) { var c = porNom[sinTilde(ft.properties.name)]; if (c) CIU_DE[ft.properties.name] = c; });
      prepararMapa(r[1]);
      echarts.registerMap('bolivia', r[1]);
      PM.imagen = { aspecto: 760 / disposicion(760).H };
      // siete indicadores no entran en una botonera en el teléfono: ahí, el selector nativo
      (PM.pequeno() ? L.selector : PM.botonera)(document.getElementById('b-medida'), Object.keys(MED).map(function (k) { return [k, MED[k].nombre]; }), estado.medida,
        function (v) { estado.medida = v; todo(); }, 'Indicador');
      periodos();
      PM.botonera(document.getElementById('b-ambito'), [['total', 'Total'], ['urbano', 'Urbano']], estado.ambito, function (v) { estado.ambito = v; periodos(); todo(); });
      textos(); cifras();
      var el = document.getElementById('chart'); el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      enlazar();
      panel('Santa Cruz');
      PM.alCambiarTema(function () { cifras(); panel(estado.k); });
      PM.preguntas(document.getElementById('preguntas'), PREGUNTAS);
      document.getElementById('fuente').innerHTML = L.fuente({}, PM.fecha(D.ventana_am[1])) + ' · Mapa: límites departamentales' +
        (D.estimados ? ' · <strong>2020</strong>: estimación POPULI (el INE no levantó el área rural de abril a diciembre), <a href="' + D.estimados.metodologia + '" target="_blank" rel="noopener">ver metodología</a>' : '');
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    // los años con dato en el ámbito elegido (2020 no tiene total: sin encuesta rural de abril a diciembre)
    function periodos() {
      var ops = [];
      for (var j = P.length - 1; j >= 0; j--) if (val(NAC, j) != null) ops.push([String(j), P[j] === 'AM' ? 'Últimos 4 trim.' : P[j] + (esEst(j) ? ' (estimado)' : '')]);
      if (val(NAC, estado.per) == null) estado.per = +ops[0][0];
      L.selector(document.getElementById('b-periodo'), ops, String(estado.per), function (v) { estado.per = +v; todo(); }, 'Periodo');
    }
    function todo() {
      textos(); cifras();
      var o = opciones(); o.animation = true;
      grafico.chart.setOption(o); PM.programarAlto(); panel(estado.k);
    }

    // ── Datos ──────────────────────────────────────────────────────────────────────────────────
    function val(c, j, k) {
      k = k || estado.medida;
      if (c !== NAC && (NO_COMP[k] || []).indexOf(c) >= 0) return null;
      var s = D.datos[estado.ambito][c], v = s && s[k] ? s[k][j == null ? estado.per : j] : null;
      if (v == null && esEst(j)) { var e = D.estimados.total[c] && D.estimados.total[c][k]; v = e ? e[0] : null; }
      return v;
    }
    function cal(c, j, k) { var s = D.calidad[estado.ambito][c]; return s && s[k || estado.medida] ? s[k || estado.medida][j == null ? estado.per : j] : null; }
    function ordenadas() {
      return DEPS.map(function (c) { return { c: c, v: val(c) }; }).filter(function (x) { return x.v != null; })
        .sort(function (a, b) { return b.v - a.v; });
    }
    // cifra con su calidad: referencial (CV 15-25 %) entre paréntesis
    var cifraTxt = function (c, j, k) { var v = val(c, j, k); return v == null ? '—' : L.conCalidad(fmt(v, MED[k || estado.medida]), cal(c, j, k)); };

    // ── Geometría del mapa (la del mapa de inflación) ─────────────────────────────────────────
    function prepararMapa(geo) {
      var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      var recorrer = function (a) { if (typeof a[0] === 'number') { x0 = Math.min(x0, a[0]); x1 = Math.max(x1, a[0]); y0 = Math.min(y0, a[1]); y1 = Math.max(y1, a[1]); } else a.forEach(recorrer); };
      geo.features.forEach(function (f) { recorrer(f.geometry.coordinates); });
      ESC = Math.cos((y0 + y1) / 2 * Math.PI / 180);
      ASP = (x1 - x0) * ESC / (y1 - y0);
      geo.features.forEach(function (f) { var cp = puntoRotulo(f.geometry); if (cp) f.properties.cp = cp; });
    }
    function puntoRotulo(g) {
      var polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
      var area = function (r) { var a = 0; for (var i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]); return Math.abs(a / 2); };
      var poly = null, am = -1;
      polys.forEach(function (p) { if (p[0] && p[0].length > 3) { var a = area(p[0]); if (a > am) { am = a; poly = p; } } });
      if (!poly) return null;
      var kx = ESC / 2.4, R = poly.map(function (r) { return r.map(function (c) { return [c[0] * kx, c[1]]; }); });
      var bx0 = Infinity, bx1 = -Infinity, by0 = Infinity, by1 = -Infinity;
      R[0].forEach(function (c) { bx0 = Math.min(bx0, c[0]); bx1 = Math.max(bx1, c[0]); by0 = Math.min(by0, c[1]); by1 = Math.max(by1, c[1]); });
      var aire = function (x, y) {
        var dentro = false, d = Infinity;
        R.forEach(function (r) {
          for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
            var a = r[j], b = r[i];
            if ((b[1] > y) !== (a[1] > y) && x < (a[0] - b[0]) * (y - b[1]) / (a[1] - b[1]) + b[0]) dentro = !dentro;
            var dx = a[0] - b[0], dy = a[1] - b[1], t = dx || dy ? Math.max(0, Math.min(1, ((x - b[0]) * dx + (y - b[1]) * dy) / (dx * dx + dy * dy))) : 0;
            var ex = b[0] + t * dx - x, ey = b[1] + t * dy - y;
            d = Math.min(d, ex * ex + ey * ey);
          }
        });
        return (dentro ? 1 : -1) * Math.sqrt(d);
      };
      var mejor = [(bx0 + bx1) / 2, (by0 + by1) / 2], md = aire(mejor[0], mejor[1]), N = 22;
      var buscar = function (x0, y0, x1, y1) {
        for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) {
          var x = x0 + (i + 0.5) * (x1 - x0) / N, y = y0 + (j + 0.5) * (y1 - y0) / N, d = aire(x, y);
          if (d > md) { md = d; mejor = [x, y]; }
        }
      };
      buscar(bx0, by0, bx1, by1);
      for (var k = 0, sx = (bx1 - bx0) / N, sy = (by1 - by0) / N; k < 2; k++, sx /= N / 3, sy /= N / 3)
        buscar(mejor[0] - 1.5 * sx, mejor[1] - 1.5 * sy, mejor[0] + 1.5 * sx, mejor[1] + 1.5 * sy);
      return [mejor[0] / kx, mejor[1]];
    }
    var LEY = 62;
    function disposicion(W) {
      if (W >= 520) {
        var gap = 18, rkW = Math.round(Math.min(400, Math.max(250, W * 0.5))), colM = W - rkW - gap;
        var mw = colM - 6, mh = mw / ASP, H = Math.ceil(Math.max(mh + 12 + LEY, 10 * 30 + 8));
        var rkH = Math.min(H - 8, 10 * 36);
        return { lado: true, H: H, mapa: { x: 3, y: 4, w: mw, h: mh }, ley: { x: 3, y: H - LEY, w: Math.min(mw, 330) },
          rk: { x: colM + gap, y: Math.round((H - rkH) / 2), w: rkW, h: rkH } };
      }
      var w2 = Math.min(W - 28, 312), h2 = w2 / ASP, filas = 10 * 28;
      return { lado: false, H: Math.ceil(h2 + 10 + LEY + 16 + filas + 4), mapa: { x: (W - w2) / 2, y: 4, w: w2, h: h2 },
        ley: { x: Math.round((W - Math.min(W - 28, 320)) / 2), y: Math.round(h2 + 14), w: Math.min(W - 28, 320) },
        rk: { x: 8, y: Math.round(h2 + 14 + LEY + 16), w: W - 18, h: filas } };
    }

    // ── Clases de color ────────────────────────────────────────────────────────────────────────
    function paso() {
      var nac = val(NAC), m = 0;
      DEPS.forEach(function (c) { var v = val(c); if (v != null) m = Math.max(m, Math.abs(v - nac)); });
      return REDONDOS.filter(function (h) { return 7 * h > m + 1e-9; })[0] || REDONDOS[REDONDOS.length - 1];
    }
    function clase(d, h) { var a = Math.abs(d), k = a < h ? 0 : a < 3 * h ? 1 : a < 5 * h ? 2 : 3; return d < 0 ? -k : k; }
    // con «más es mejor» la rampa se invierte: estar sobre Bolivia es turquesa
    function colorDe(c, h) { var v = val(c); if (v == null) return null; var k = clase(v - val(NAC), h); return RAMPA[(med().mejorBaja ? k : -k) + 3]; }
    function txClase(col) { return PM.dk() ? (col === '#005F73' ? '#94D2BD' : PM.tx(col)) : (TX_CLASE[col] || PM.tx(col)); }
    var niebla = function () { return PM.dk() ? '#242C30' : '#DFE5EA'; };
    var peor = function (v, nac) { return med().mejorBaja ? v > nac : v < nac; };

    function textos() {
      document.getElementById('sub').textContent = med().desc + ' · ' + etqPer(estado.per) + (estado.ambito === 'urbano' ? ' · sólo área urbana' : '') +
        '. Rojizo: peor que Bolivia; turquesa: mejor.';
    }

    function cifras() {
      var nac = val(NAC), fil = ordenadas(), n = fil.length; if (!n) return;
      var alto = fil[0], bajo = fil[n - 1];
      var serie = function (c) { return P.map(function (p, j) { return val(c, j); }); };
      var tono = function (v) { return peor(v, nac) ? 'malo' : 'bueno'; };
      var colV = function (v) { return peor(v, nac) ? C.rojo : C.turquesa; };
      var anterior = estado.per > 0 ? val(NAC, estado.per - 1) : null, d = anterior == null ? null : nac - anterior;
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: C.tinta, rotulo: 'Bolivia · ' + etqCorta(estado.per), valor: fmt(nac),
          delta: d == null ? med().nombre : PM.flecha(d, med().fmt === 'bs' ? 5 : 0.05) + ' ' + dif(d) + ' frente a ' + P[estado.per - 1].replace('AM', 'el año móvil'), tono: 'neutro', serie: serie(NAC) }) +
        PM.kpi({ color: colV(alto.v), rotulo: 'Más alto · ' + alto.c, valor: cifraTxt(alto.c), delta: dif(alto.v - nac) + ' frente a Bolivia', tono: tono(alto.v), serie: serie(alto.c) }) +
        PM.kpi({ color: colV(bajo.v), rotulo: 'Más bajo · ' + bajo.c, valor: cifraTxt(bajo.c), delta: dif(bajo.v - nac) + ' frente a Bolivia', tono: tono(bajo.v), serie: serie(bajo.c) }) +
        PM.kpi({ color: C.oro, rotulo: 'Santa Cruz', valor: cifraTxt('Santa Cruz'), delta: val('Santa Cruz') == null ? 'no comparable' : dif(val('Santa Cruz') - nac) + ' frente a Bolivia',
          tono: val('Santa Cruz') == null ? 'neutro' : tono(val('Santa Cruz')), serie: serie('Santa Cruz') });
    }

    // ── Lienzo: mapa + ranking + leyenda en un solo gráfico ────────────────────────────────────
    var medidor;
    function ancho(t, fuente) { medidor = medidor || document.createElement('canvas').getContext('2d'); medidor.font = fuente; return medidor.measureText(t).width; }
    function mezcla(a, b, t) {
      var p = function (h) { var n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }, x = p(a), y = p(b);
      return 'rgb(' + x.map(function (v, i) { return Math.round(v + (y[i] - v) * t); }).join(',') + ')';
    }

    function opciones() {
      var el = document.getElementById('chart'), ch = echarts.getInstanceByDom(el);
      var exp = el.style.left === '-40000px', chico = PM.pequeno(), dk = PM.dk();
      var W = el.clientWidth || 600, Q = disposicion(W);
      if (!exp) {
        if (Math.abs(el.clientHeight - Q.H) > 1) el.style.height = Q.H + 'px';
        if (ch && Math.abs(ch.getHeight() - el.clientHeight) > 1) ch.resize();
      }
      var nac = val(NAC), h = paso(), fil = ordenadas();
      var card = PM.var('--card') || '#ffffff', tinta = PM.col(C.tinta), pz = dk ? '#8A9699' : '#5C6B70';
      var inter = PM.inter(), mono = PM.mono();
      var puesto = {}; fil.forEach(function (x, j) { puesto[x.c] = j + 1; });
      ITEMS = [NAC].concat(fil.map(function (x) { return x.c; })).concat(DEPS.filter(function (c) { return puesto[c] == null; }));

      var fN = chico ? 10 : 10.5, fV = chico ? 10.5 : 11;
      var datosMapa = Object.keys(CIU_DE).map(function (g) {
        var c = CIU_DE[g], col = colorDe(c, h) || niebla(), t = PM.sobre(col);
        var halo = { textBorderColor: col, textBorderWidth: 2.5 };
        var rich = { n: PM.mezclar({ fontFamily: inter, fontSize: fN, fontWeight: 600, color: t, lineHeight: fN + 3 }, halo),
          v: PM.mezclar({ fontFamily: mono, fontSize: fV, fontWeight: 700, color: t, lineHeight: fV + 3 }, halo) };
        return { name: g, value: val(c), itemStyle: { areaColor: col }, emphasis: { itemStyle: { areaColor: col }, label: { rich: rich } }, label: { rich: rich } };
      });
      var mapa = {
        type: 'map', id: 'mapa', name: med().nombre, map: 'bolivia', roam: false, selectedMode: false, z: 2,
        aspectScale: ESC, layoutCenter: [Q.mapa.x + Q.mapa.w / 2, Q.mapa.y + Q.mapa.h / 2], layoutSize: ASP < 1 ? Q.mapa.h : Q.mapa.w,
        itemStyle: { areaColor: niebla(), borderColor: card, borderWidth: 1 },
        label: { show: true, formatter: function (p) { var c = CIU_DE[p.name]; return '{n|' + c + '}\n{v|' + (val(c) == null ? 'n. c.' : cifraTxt(c)) + '}'; } },
        emphasis: { label: { show: true }, itemStyle: { borderColor: tinta, borderWidth: 1.5 } },
        select: { disabled: true },
        data: datosMapa
      };

      var R = Q.rk, fNom = chico ? 11 : 12, fCif = chico ? 10.5 : 11.5, fRk = chico ? 9.5 : 10;
      var rankW = Math.ceil(ancho('9', '500 ' + fRk + 'px ' + mono)) + 8;
      var nameW = Math.ceil(Math.max.apply(null, ITEMS.map(function (c) { return ancho(c, '700 ' + fNom + 'px ' + inter); })));
      var plotL = R.x + rankW + nameW + 12, plotW = R.w - rankW - nameW - 12;
      var vals = ITEMS.map(function (c) { return val(c); }).filter(function (v) { return v != null; });
      var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
      var PAD = 3, GAP = 4, lw = function (c) { return ancho(cifraTxt(c), '600 ' + fCif + 'px ' + mono) + 2 * PAD; };
      var span = (hi - lo) || 1, k = plotW / span, pxL = 4, pxR = 4;
      for (var it = 0; it < 5; it++) {
        pxL = 4; pxR = 4;
        ITEMS.forEach(function (c) { var v = val(c); if (v == null) return; if (v < 0) pxL = Math.max(pxL, GAP + lw(c) - (v - lo) * k); else pxR = Math.max(pxR, GAP + lw(c) - (hi - v) * k); });
        k = (plotW - pxL - pxR) / span;
      }
      var X = function (v) { return plotL + pxL + (v - lo) * k; }, cero = X(0), xn = X(nac);
      var lineaCero = dk ? 'rgba(226,232,240,.55)' : 'rgba(0,18,25,.5)', filete = dk ? '#2A3A50' : '#E2DDD3';
      var sombra = mezcla(card.length === 7 ? card : '#FFFFFF', dk ? '#E2E8F0' : '#001219', dk ? 0.07 : 0.045);
      var colB = function (c) { return c === NAC ? tinta : colorDe(c, h) || niebla(); };
      var colT = function (c) { return c === NAC ? tinta : txClase(colorDe(c, h) || '#8A9699'); };
      var ranking = {
        type: 'custom', id: 'ranking', name: med().nombre, coordinateSystem: 'cartesian2d', encode: { x: 0, y: 1, tooltip: 0 },
        data: ITEMS.map(function (c, j) { return { id: c, value: [val(c) == null ? 0 : val(c), j] }; }),
        renderItem: function (params, api) {
          var c = ITEMS[params.dataIndex], cs = params.coordSys, cy = api.coord([0, api.value(1)])[1], rh = api.size([0, 1])[1];
          var v = val(c), esN = c === NAC;
          var bh = Math.round(Math.min(chico ? 16 : 19, rh * 0.58));
          var hijos = [
            { type: 'rect', z2: 0, shape: { x: cs.x, y: -rh / 2, width: cs.width, height: rh }, style: { fill: 'rgba(0,0,0,0)' }, emphasis: { style: { fill: sombra } } },
            { type: 'text', z2: 5, x: plotL - 12, y: 0,
              style: { text: c, fontFamily: inter, fontSize: fNom, fontWeight: esN ? 700 : 500, fill: tinta, align: 'right', verticalAlign: 'middle' },
              emphasis: { style: { fontWeight: 700 } } }
          ];
          if (v == null) {
            hijos.push({ type: 'text', z2: 5, x: cero + GAP, y: 0, style: { text: 'no comparable', fontFamily: inter, fontSize: fCif - 1, fontWeight: 500, fill: pz, align: 'left', verticalAlign: 'middle' } });
          } else {
            var x1 = X(v), neg = v < 0;
            hijos.push({ type: 'rect', z2: 2, shape: { x: Math.min(cero, x1), y: -bh / 2, width: Math.max(1, Math.abs(x1 - cero)), height: bh }, style: { fill: colB(c), opacity: cal(c) === 1 || esEst() ? 0.55 : 1 } });   // referencial o estimado: más clara
            hijos.push({ type: 'text', z2: 5, x: neg ? x1 - GAP : x1 + GAP, y: 0, transition: ['x'],
              style: { text: cifraTxt(c), fontFamily: mono, fontSize: fCif, fontWeight: 600, fill: colT(c), align: neg ? 'right' : 'left', verticalAlign: 'middle', backgroundColor: card, padding: [1, PAD] },
              emphasis: { style: { backgroundColor: sombra } } });
          }
          if (!esN && puesto[c]) hijos.push({ type: 'text', z2: 5, x: cs.x, y: 0,
            style: { text: String(puesto[c]), fontFamily: mono, fontSize: fRk, fontWeight: 500, fill: pz, align: 'left', verticalAlign: 'middle' } });
          if (esN) {
            var abajo = rh / 2, fin = cs.y + cs.height - cy;
            hijos.push({ type: 'line', z2: 1, silent: true, shape: { x1: cs.x, y1: abajo, x2: cs.x + cs.width, y2: abajo }, style: { stroke: filete, lineWidth: 1 } });
            hijos.push({ type: 'line', z2: 1, silent: true, shape: { x1: cero, y1: cs.y + 2 - cy, x2: cero, y2: fin - 2 }, style: { stroke: lineaCero, lineWidth: 1 } });
            hijos.push({ type: 'line', z2: 1, silent: true, shape: { x1: xn, y1: abajo + 3, x2: xn, y2: fin - 2 }, style: { stroke: pz, lineWidth: 1.25, lineDash: [4, 3], opacity: 0.8 } });
          }
          return { type: 'group', y: cy, transition: ['y'], children: hijos };
        }
      };

      return {
        animationDurationUpdate: 650, animationEasingUpdate: 'cubicInOut',
        grid: { left: R.x, top: R.y, width: R.w, height: R.h, containLabel: false },
        xAxis: { type: 'value', min: lo, max: hi, show: false },
        yAxis: { type: 'category', inverse: true, show: false, data: ITEMS.map(function (c, j) { return String(j); }) },
        tooltip: PM.tooltip(tip, chico ? { trigger: 'item', position: cerca } : { trigger: 'item' }),
        graphic: { elements: leyenda(Q.ley, h, nac, chico) },
        series: [mapa, ranking]
      };
    }

    function leyenda(B, h, nac, chico) {
      var pz = PM.dk() ? '#8A9699' : '#5C6B70', tinta = PM.col(C.tinta), inter = PM.inter(), mono = PM.mono();
      var sw = B.w / 7, y = B.y, els = [], esBs = med().fmt === 'bs', dec = esBs ? 0 : (PM.tick(h).indexOf(',') < 0 ? 0 : PM.tick(h).split(',')[1].length);
      els.push({ id: 'ley-t', type: 'text', silent: true, x: B.x, y: y, style: { text: 'Diferencia con Bolivia (' + fmt(nac) + ')' + (esBs ? ', en Bs' : ', en pp'), font: '600 ' + (chico ? 10 : 10.5) + 'px ' + inter, fill: tinta, align: 'left', verticalAlign: 'top' } });
      var rampa = med().mejorBaja ? RAMPA : RAMPA.slice().reverse();
      rampa.forEach(function (col, i) {
        var a = Math.round(B.x + i * sw), b = Math.round(B.x + (i + 1) * sw);
        els.push({ id: 'ley-c' + i, type: 'rect', silent: true, shape: { x: a, y: y + 19, width: b - a, height: 10 }, style: { fill: col } });
      });
      [-5, -3, -1, 1, 3, 5].forEach(function (m, i) {
        var v = m * h;
        els.push({ id: 'ley-v' + i, type: 'text', silent: true, x: Math.round(B.x + (i + 1) * sw), y: y + 33,
          style: { text: (v > 0 ? '+' : '') + PM.num(v, dec), font: '500 ' + (chico ? 9.5 : 10) + 'px ' + mono, fill: pz, align: 'center', verticalAlign: 'top' } });
      });
      var fS = '500 ' + (chico ? 9.5 : 10) + 'px ' + inter;
      els.push({ id: 'ley-a', type: 'text', silent: true, x: B.x, y: y + 48, style: { text: '← menos que Bolivia', font: fS, fill: pz, align: 'left', verticalAlign: 'top' } });
      els.push({ id: 'ley-b', type: 'text', silent: true, x: B.x + B.w, y: y + 48, style: { text: 'más que Bolivia →', font: fS, fill: pz, align: 'right', verticalAlign: 'top' } });
      return els;
    }

    function enlazar() {
      var ch = grafico.chart;
      var soltar = function () {
        if (!hover) return;
        ch.dispatchAction({ type: 'downplay', seriesId: 'mapa', name: hover.g });
        ch.dispatchAction({ type: 'downplay', seriesId: 'ranking', dataIndex: hover.j });
        hover = null;
      };
      ch.on('mouseover', function (p) {
        var c = p.seriesId === 'mapa' ? CIU_DE[p.name] : p.seriesId === 'ranking' ? ITEMS[p.dataIndex] : null;
        if (!c) return;
        var g = Object.keys(CIU_DE).filter(function (x) { return CIU_DE[x] === c; })[0], j = ITEMS.indexOf(c);
        if (hover && hover.c === c) return;
        soltar();
        hover = { c: c, g: g, j: j };
        if (p.seriesId === 'mapa') ch.dispatchAction({ type: 'highlight', seriesId: 'ranking', dataIndex: j });
        else if (g) ch.dispatchAction({ type: 'highlight', seriesId: 'mapa', name: g });
      });
      ch.on('mouseout', soltar);
      ch.on('globalout', soltar);
      document.addEventListener('touchstart', function (e) {
        if (!document.getElementById('chart').contains(e.target)) { ch.dispatchAction({ type: 'hideTip' }); soltar(); }
      }, { passive: true });
    }
    function cerca(pt, params, dom, rect, size) {
      var w = size.contentSize[0], hh = size.contentSize[1], Wv = size.viewSize[0];
      var y = pt[1] - hh - 18 >= 0 ? pt[1] - hh - 18 : pt[1] + 20;
      return [Math.min(Math.max(pt[0] - w / 2, 4), Math.max(4, Wv - w - 4)), y];
    }

    function tip(p) {
      var c = p.seriesId === 'mapa' ? CIU_DE[p.name] : p.seriesId === 'ranking' ? ITEMS[p.dataIndex] : null;
      if (!c) return '';
      panel(c);
      var nac = val(NAC);
      if (c === NAC) return PM.ttTitulo('Bolivia · ' + etqCorta(estado.per), med().larga) + PM.ttFila(C.tinta, 'Bolivia', fmt(nac), 'area');
      var v = val(c);
      var h = PM.ttTitulo(c + ' · ' + etqCorta(estado.per), med().larga + (estado.ambito === 'urbano' ? ' · urbano' : ''));
      if (v == null) return h + PM.ttFila(null, 'No comparable', '—');
      h += PM.ttFila(colorDe(c, paso()), c, cifraTxt(c), 'area') + PM.ttFila(C.tinta, 'Bolivia', fmt(nac), 'area') + PM.ttTotal('Diferencia', dif(v - nac));
      if (cal(c) === 1) h += PM.ttPie('Entre paréntesis: dato referencial (error de muestreo del 15 al 25 %)');
      if (esEst()) h += PM.ttPie('2020: estimación POPULI (sin encuesta rural de abril a diciembre)');
      return h;
    }

    // ── Panel de lectura: el departamento bajo el cursor, con todos sus indicadores ─────────────
    function panel(c) {
      if (!D || !c) return;
      estado.k = c;
      var nac = val(NAC), fil = ordenadas(), n = fil.length;
      document.getElementById('panel-fecha').textContent = etqCorta(estado.per);
      var html = PM.pb(C.tinta, 'Bolivia', fmt(nac), med().desc + ', ' + etqPer(estado.per) + '.');
      if (c !== NAC) {
        var v = val(c), r = fil.map(function (x) { return x.c; }).indexOf(c) + 1;
        var desc = v == null ? 'No comparable en este indicador (ver las preguntas).'
          : 'Puesto <strong>' + r + ' de ' + n + '</strong> (de mayor a menor); diferencia con Bolivia: <strong>' + dif(v - nac) + '</strong>.' + (cal(c) === 1 ? ' Dato referencial.' : '');
        var j19 = P.indexOf('2019');
        if (v != null && j19 >= 0 && j19 !== estado.per && val(c, j19) != null) desc += ' En 2019: ' + cifraTxt(c, j19) + '.';
        var tabla = '<div class="ind">' + Object.keys(MED).map(function (k) {
          return '<span class="ind-n">' + MED[k].nombre + '</span><span class="ind-v">' + cifraTxt(c, null, k) + '</span>';
        }).join('') + '</div>';
        html += PM.pb(v == null ? C.gris : peor(v, nac) ? C.rojo : C.turquesa, c, v == null ? '—' : cifraTxt(c), desc).replace(/<\/div>$/, tabla + '</div>');
      }
      document.getElementById('panel').innerHTML = html + PM.ctx((esEst() ? 'Entre abril y diciembre de 2020 el INE no levantó la encuesta en el área rural: las cifras de 2020 son una <strong>estimación POPULI</strong> (el primer trimestre observado y los otros tres estimados con ' + L.METODO + '). <a href="' + D.estimados.metodologia + '" target="_blank" rel="noopener">Ver metodología</a>. ' : '') + lectura());
    }
    function lectura() {
      var nac = val(NAC), fil = ordenadas(), n = fil.length; if (!n) return '';
      var a = fil[0], z = fil[n - 1], peores = fil.filter(function (x) { return peor(x.v, nac); });
      var t = 'En ' + med().larga + ', el rango va de <strong>' + z.c + '</strong> (' + cifraTxt(z.c) + ') a <strong>' + a.c + '</strong> (' + cifraTxt(a.c) + '); Bolivia: ' + fmt(nac) + '. ' +
        '<strong>' + peores.length + ' de ' + n + '</strong> departamentos están peor que el promedio del país.';
      var sc = val('Santa Cruz');
      if (sc != null) t += ' Santa Cruz: ' + cifraTxt('Santa Cruz') + ' (' + dif(sc - nac) + ').';
      return t;
    }

    // ── Descarga de datos: los nueve departamentos y Bolivia, todos los indicadores del periodo ──
    PM.leyendaImagen = function () { return []; };
    PM.tablaDatos = function () {
      var ks = Object.keys(MED);
      var fila = function (c) { return [c, etqCorta(estado.per) + (esEst() ? ' (estimación POPULI)' : ''), estado.ambito].concat(ks.map(function (k) { return val(c, null, k); })); };
      return { cols: ['Departamento', 'Periodo', 'Ámbito'].concat(ks.map(function (k) { return MED[k].nombre + (MED[k].fmt === 'bs' ? ' (Bs del 1T-2026)' : ' (%)'); })),
        filas: [fila(NAC)].concat(DEPS.map(fila)) };
    };

    var PREGUNTAS = [
      ['¿Por qué cuatro trimestres juntos?', 'La ECE tiene unas 17.800 viviendas por trimestre: alcanza para Bolivia, el área urbana y los departamentos del eje, pero en los departamentos más chicos el error de muestreo de un trimestre es alto (la desocupación de Pando o del Beni sale con un error relativo del 20-27 %). Juntando los cuatro trimestres del año el error baja a la mitad. «Últimos 4 trim.» es el año móvil que termina en el último trimestre con microdato.'],
      ['¿Cómo se lee el mapa?', 'El color es la <strong>diferencia con Bolivia</strong>: rojizo, peor que el país; turquesa, mejor; arena, parecido. Para la desocupación, la informalidad y quienes ganan menos que el mínimo, «peor» es más alto; para el ingreso, el seguro de salud y la participación, «peor» es más bajo. El ranking ordena las mismas cifras de mayor a menor, con Bolivia arriba y su raya punteada detrás de las barras.'],
      ['¿Qué quieren decir los paréntesis?', 'Una cifra entre paréntesis (y su barra más clara) es <strong>referencial</strong>: su error de muestreo está entre 15 y 25 % del valor. Sirve para ordenar, no para afirmar diferencias chicas. Las cifras con un error mayor no se muestran. Los ingresos son medianas: no llevan esa marca.'],
      ['¿Por qué el Beni no tiene subutilización?', 'Desde el tercer trimestre de 2021, en el Beni casi nadie de los que trabajan menos de 40 horas declara querer trabajar más (0-3 %, frente a 10-40 % en el resto del país). Es un efecto de cómo se levanta la encuesta, no un dato del mercado laboral: su subocupación y su subutilización amplia no son comparables.'],
      ['¿Y 2020?', 'Entre abril y diciembre de 2020 la encuesta no se levantó en el área rural. En el ámbito urbano, 2020 es dato del INE. En el total, 2020 es una <strong>estimación POPULI</strong>: el primer trimestre observado y los otros tres armados con el área urbana observada más la parte rural de cada departamento estimada con un promedio de modelos de series de tiempo (y ajustada para que los nueve sumen el área rural del país). El seguro de salud no se estima: la pregunta no se hizo en la pandemia. <a href="../metodologia.html#hueco-2020" target="_blank" rel="noopener">Metodología</a>.']
    ];
  })();
  </script>
